# Static site (not an SPA): real files only, Astro's 404 page for anything else.
# Hashed assets (/_astro/) are cached forever; HTML, the RSS feed and sitemaps are revalidated.
# add_header in a location replaces the server-level ones, so the security headers are repeated per location.
server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  server_tokens off;

  gzip on;
  gzip_types text/css application/javascript application/xml application/rss+xml image/svg+xml;

  error_page 404 /404.html;

  location /_astro/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    add_header X-Content-Type-Options "nosniff" always;
    try_files $uri =404;
  }

  location = /404.html {
    internal;
    add_header Cache-Control "no-cache";
    add_header X-Content-Type-Options "nosniff" always;
  }

  location / {
    try_files $uri $uri/index.html $uri.html =404;
    add_header Cache-Control "no-cache";
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "DENY" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
  }
}
