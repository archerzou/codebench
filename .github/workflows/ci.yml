name: ci
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dotnet:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v5
        with: { dotnet-version: '10.0.x' }
      - run: dotnet restore CodeBench.slnx
      - run: dotnet build CodeBench.slnx -c Release --no-restore   # TreatWarningsAsErrors is on
      - name: Test (unit, integration via Testcontainers, architecture)
        run: dotnet test CodeBench.slnx -c Release --no-build --logger trx --results-directory TestResults
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: dotnet-test-results, path: TestResults }

  # Build plan 1.10 / FE-12: lint, type-check, test and build both frontends.
  # web:       eslint (zero warnings) → vitest → tsc -b + vite build
  # marketing: astro check → gen-problems + astro build + verify-dist (fails on any hidden-test / reference leak)
  # Both builds read ../../docs/design/tokens.css (and marketing ../../problems) from the checkout.
  frontend:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        app: [web, marketing]
    defaults:
      run:
        working-directory: apps/${{ matrix.app }}   # block style: `${{ }}` inside a `{ }` flow map is invalid YAML
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/${{ matrix.app }}/package-lock.json
      - run: npm ci
      - run: npm run lint --if-present
      - run: npm run check --if-present
      - run: npm test --if-present -- --run
      - run: npm run build

  # Build plan 1.10: the compose `app` profile images build (Dockerfiles + additional build contexts
  # `design` / `problems`). Build only — pushing to GHCR is images.yml in Phase 3.
  compose-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Build api, web and marketing images
        run: docker compose -f deploy/docker-compose.yml --env-file deploy/.env.example --profile app build
