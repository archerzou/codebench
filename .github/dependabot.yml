version: 2
updates:
  - package-ecosystem: "nuget"
    directory: "/"
    schedule:
      interval: "weekly"
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
  - package-ecosystem: "docker"
    directories: ["/src/Web.Api", "/src/Worker", "/apps/web", "/apps/marketing"]
    schedule:
      interval: "weekly"
  # Frontends (build plan 1.10). Minor/patch updates are grouped into one PR per app to keep the noise down;
  # majors arrive one by one so breaking changes (e.g. ESLint 10, TypeScript 7 — see tracker 1.8.1) are visible.
  - package-ecosystem: "npm"
    directory: "/apps/web"
    schedule:
      interval: "weekly"
    groups:
      web-minor-and-patch:
        update-types: ["minor", "patch"]
  - package-ecosystem: "npm"
    directory: "/apps/marketing"
    schedule:
      interval: "weekly"
    groups:
      marketing-minor-and-patch:
        update-types: ["minor", "patch"]
