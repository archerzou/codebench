          throw new NotImplementedException();
      }
  }
reference: |
  public class Solution
  {
      public long SumOfEvens(int[] nums)
      {
          long sum = 0;
          foreach (var n in nums) if ((n & 1) == 0) sum += n;
          return sum;
      }
  }
limits: { timeoutSeconds: 10, memoryMb: 256 }
